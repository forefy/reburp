name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build extension jar
        run: ./gradlew shadowJar --no-daemon

      - name: Check Montoya API coverage
        run: python3 tools/api_coverage.py

      # The OpenAPI spec is hand-written and has drifted from the code before: phantom and
      # missing fields, duplicate operationIds, defaults outside their enums. These tests need
      # no Burp, so they gate every push instead of waiting for a live smoke run.
      - name: Check the OpenAPI spec against the code
        run: ./gradlew test --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: reburp
          path: build/libs/reburp-*.jar
          if-no-files-found: error
